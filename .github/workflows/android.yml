name: Android CI

on: [push, pull_request]

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install NDK and SDK platform
      id: ndk
      run: |
        NDK_VERSION=$(grep '^ndk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        COMPILE_SDK=$(grep '^compileSdk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" "platforms;android-$COMPILE_SDK.0"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "version=$NDK_VERSION" >> $GITHUB_OUTPUT

    - name: Compute native dependencies cache key
      id: deps-key
      run: echo "key=${{ steps.ndk.outputs.version }}-$(git submodule status | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT

    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        path: |
          binary/jni/deps
          binary/jni/openssl/out
          binary/jni/miniupnp/miniupnpc/out
        key: native-deps-${{ steps.deps-key.outputs.key }}-${{ hashFiles('binary/jni/build_*.sh') }}

    - name: Build native dependencies
      run: binary/jni/build.sh

    - uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: app/build/outputs/apk/debug/*.apk

  build-binary:
    name: Build standalone binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - name: Install NDK
      id: ndk
      run: |
        NDK_VERSION=$(grep '^ndk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "version=$NDK_VERSION" >> $GITHUB_OUTPUT

    - name: Compute native dependencies cache key
      id: deps-key
      run: echo "key=${{ steps.ndk.outputs.version }}-$(git submodule status | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT

    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        path: |
          binary/jni/deps
          binary/jni/openssl/out
          binary/jni/miniupnp/miniupnpc/out
        key: native-deps-${{ steps.deps-key.outputs.key }}-${{ hashFiles('binary/jni/build_*.sh') }}

    - name: Build binary with NDK
      run: binary/jni/build.sh -b

    - name: Create package with built binaries
      run: |
        pushd contrib/binary_pack
        ./build-archive
        popd

    - name: Upload binaries archive
      uses: actions/upload-artifact@v4
      with:
        name: android-binaries
        path: binary/libs/*

    - name: Upload binaries package
      uses: actions/upload-artifact@v4
      with:
        name: android-binaries-pack
        path: contrib/binary_pack/i2pd_*_android_binary.zip
