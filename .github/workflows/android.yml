name: Android CI

on: [push, pull_request]

# Builds and checks only, nothing is published from here
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install NDK and SDK platform
      id: ndk
      run: |
        NDK_VERSION=$(grep '^ndk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        COMPILE_SDK=$(grep '^compileSdk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" "platforms;android-$COMPILE_SDK.0"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "version=$NDK_VERSION" >> $GITHUB_OUTPUT

    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        # Archives, unpacked sources and OpenSSL builds; versions and checksums are in the scripts
        path: binary/jni/deps
        key: native-deps-${{ steps.ndk.outputs.version }}-${{ hashFiles('binary/jni/fetch_deps.sh', 'binary/jni/build_openssl.sh') }}

    - name: Build native dependencies
      run: binary/jni/build.sh

    - uses: gradle/actions/setup-gradle@v4

    # Release is what gets published: R8, resource shrinking and locale filters only run there.
    # Without keystore.properties the release APKs are unsigned.
    - name: Build with Gradle
      run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintRelease

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk

  reproducible:
    name: Check reproducible build
    runs-on: ubuntu-latest
    steps:
    # The same commit twice, in directories with different absolute paths
    - uses: actions/checkout@v5
      with:
        path: a
        submodules: 'recursive'

    - uses: actions/checkout@v5
      with:
        path: other/place/b
        submodules: 'recursive'

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install NDK and SDK platform
      id: ndk
      working-directory: a
      run: |
        NDK_VERSION=$(grep '^ndk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        COMPILE_SDK=$(grep '^compileSdk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" "platforms;android-$COMPILE_SDK.0"
        echo "version=$NDK_VERSION" >> $GITHUB_OUTPUT

    - uses: gradle/actions/setup-gradle@v4

    # Both trees build everything from source, OpenSSL included; only the downloaded archives are shared
    - name: Build in the first directory
      working-directory: a
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.ndk.outputs.version }}
        binary/jni/build.sh
        ./gradlew --no-daemon assembleRelease

    # The SDK and NDK through symlinks: paths of the toolchain must not end up in the output either
    - name: Build in the second directory
      working-directory: other/place/b
      run: |
        ln -s "$ANDROID_HOME" "$RUNNER_TEMP/sdk"
        export ANDROID_HOME=$RUNNER_TEMP/sdk ANDROID_SDK_ROOT=$RUNNER_TEMP/sdk
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.ndk.outputs.version }}
        mkdir -p binary/jni/deps
        cp "$GITHUB_WORKSPACE"/a/binary/jni/deps/*.tar.gz binary/jni/deps/
        binary/jni/build.sh
        ./gradlew --no-daemon assembleRelease

    - name: Compare
      run: python3 -I a/contrib/reproducible/compare.py a/app/build/outputs/apk/release other/place/b/app/build/outputs/apk/release

  build-binary:
    name: Build standalone binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        # Whole history with tags: the package is named after "git describe --tags"
        fetch-depth: 0

    - name: Install NDK
      id: ndk
      run: |
        NDK_VERSION=$(grep '^ndk *=' gradle/libs.versions.toml | cut -d'"' -f2)
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "version=$NDK_VERSION" >> $GITHUB_OUTPUT

    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        # Archives, unpacked sources and OpenSSL builds; versions and checksums are in the scripts
        path: binary/jni/deps
        key: native-deps-${{ steps.ndk.outputs.version }}-${{ hashFiles('binary/jni/fetch_deps.sh', 'binary/jni/build_openssl.sh') }}

    - name: Build binary with NDK
      run: binary/jni/build.sh -b

    - name: Create package with built binaries
      run: |
        pushd contrib/binary_pack
        ./build-archive
        popd

    - name: Upload binaries archive
      uses: actions/upload-artifact@v4
      with:
        name: android-binaries
        path: binary/libs/*

    - name: Upload binaries package
      uses: actions/upload-artifact@v4
      with:
        name: android-binaries-pack
        path: contrib/binary_pack/i2pd_*_android_binary.zip
